<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automasi.ai</title>
    <style>
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.2; 
            color: #000;
            background-color: #fff;
            margin: 0;
            padding: 40px; 
            max-width: 1200px; 
        }

        
        .intro-text {
            font-size: clamp(2rem, 5vw, 4rem); 
            font-weight: 800; 
            letter-spacing: -0.03em; 
            margin-bottom: 100px;
            max-width: 900px;
            text-transform: uppercase; 
        }

        
        section {
            border-top: 1px solid #000; 
            padding-top: 20px;
            margin-bottom: 80px;
            display: grid;
            grid-template-columns: 1fr 2fr; 
        }

        .section-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .content-list {
            list-style: none; 
            padding: 0;
            margin: 0;
            font-size: 1.5rem;
            font-weight: 500;
        }

        .content-list li {
            margin-bottom: 10px;
        }

        
        @media (max-width: 768px) {
            section { grid-template-columns: 1fr; }
            body { padding: 20px; }
            .intro-text { margin-bottom: 50px; }
        }

        
        a { color: #000; text-decoration: underline; }
        a:hover { background: #000; color: #fff; text-decoration: none; }
    </style>

  <circle cx="68" cy="25" r="1" fill="#333" />
